# The lab web page, the Go example under /api and the collector's OTLP/HTTP receiver under /otlp: one origin, so the
# browser needs no CORS and its requests carry the trace (traceparent) to the Go service.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://go-example:8080/;
    }

    location /otlp/ {
        proxy_pass http://otel-collector:4318/;
    }
}
