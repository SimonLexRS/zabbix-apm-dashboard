# Add-on for the OpenTelemetry Demo on a single server next to Zabbix: every application service and Kafka, without the
# demo's own Jaeger, Grafana, Prometheus and OpenSearch, because Zabbix APM is the viewer. Needs about 10 GiB of RAM.
# Copy it and otelcol-config-zabbix.yml to the root of the demo; see README.md.
#
#   docker compose -f compose.yaml -f compose.full.yaml -f compose.zabbix-lite.yaml \
#     --env-file .env --env-file .env.override --env-file .env.zabbix up -d --no-build

services:
  frontend-proxy:
    ports: !override
      - "${DEMO_HOST_PORT:-18080}:${ENVOY_PORT}"
      - "127.0.0.1:${ENVOY_ADMIN_PORT}:${ENVOY_ADMIN_PORT}"

  frontend:
    environment:
      - PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT=http://${DEMO_PUBLIC_HOST:-localhost}:${DEMO_HOST_PORT:-18080}/otlp-http/v1/traces

  otel-collector:
    command:
      - "--config=/etc/otelcol-config.yml"
      - "--config=/etc/otelcol-config-full.yml"
      - "--config=/etc/otelcol-config-zabbix.yml"
      - "--config=/etc/otelcol-config-extras.yml"
      - "--feature-gates=service.profilesSupport"
    volumes:
      - ./otelcol-config-zabbix.yml:/etc/otelcol-config-zabbix.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - ZABBIX_APM_ENDPOINT=${ZABBIX_APM_ENDPOINT:?set ZABBIX_APM_ENDPOINT in .env.zabbix}
      - ZABBIX_APM_NAMESPACE=${ZABBIX_APM_NAMESPACE:-opentelemetry-demo}
      - ZABBIX_APM_INSECURE=${ZABBIX_APM_INSECURE:-false}
