# The store pages, the API under /api and the OTLP/HTTP receiver of the Zabbix APM Collector under /otlp: one origin,
# so the browser needs no CORS and its requests carry the trace (traceparent) to the "shop" service.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://shop:8000/;
        proxy_read_timeout 60s;
    }

    location /otlp/ {
        proxy_pass http://host.docker.internal:4318/;
    }

    location ~* \.(html|js|css)$ {
        add_header Cache-Control no-cache;
    }
}
